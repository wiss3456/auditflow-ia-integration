# Few-shot examples — risques réels extraits des TaRi ONCF
few_shot_risks:
  - objet: "Réception des réclamations"
    sous_objet: "Enregistrement sur la PGR"
    risque: "Réclamation non saisie ou saisie incomplète (ex: réclamations verbales remontées par les ACT dans leurs rapports circonstanciels)"
    bonne_pratique: "Contrôle journalier et checklist de saisie obligatoire"
    objectif_controle: "Assurer l'exhaustivité et la fiabilité de l'enregistrement des réclamations"

  - objet: "Traitement initial"
    sous_objet: "Respect des délais"
    risque: "Non-respect des délais de traitement réglementaires des réclamations clients"
    bonne_pratique: "Alerte automatique dans le cas de dépassement de délai via la PGR"
    objectif_controle: "Garantir le traitement des réclamations dans les délais définis"

  - objet: "Pré-crise (Anticipation)"
    sous_objet: "Plan de communication de crise"
    risque: "Improvisation en cas de crise — absence de scénarios types (dark sites) pré-rédigés et obsolescence des procédures face aux nouveaux canaux (réseaux sociaux)"
    bonne_pratique: "Plan validé, diffusé et accessible — manuel de crise disponible en formats numérique et physique (papier)"
    objectif_controle: "Disposer d'un plan de communication de crise formalisé et opérationnel"

  - objet: "Enquête / Escalade"
    sous_objet: "Rôle des entités"
    risque: "Flou dans la répartition des responsabilités entre entités lors du traitement des réclamations"
    bonne_pratique: "Définir une matrice RACI claire dans la procédure + rappeler les responsabilités dans chaque atelier de sensibilisation"
    objectif_controle: "Clarifier les rôles et responsabilités de chaque entité impliquée"