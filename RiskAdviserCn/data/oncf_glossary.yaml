organization:
  name: "ONCF — Office National des Chemins de Fer"
  country: "Maroc"
  sector: "Transport ferroviaire"
  audit_department: "Direction de l'Audit Interne"

acronyms:
  PGR: "Plateforme de Gestion des Réclamations (système informatique de suivi des réclamations clients)"
  GMAO: "Gestion de Maintenance Assistée par Ordinateur (système de gestion des interventions de maintenance)"
  ACT: "Agent Commercial Train (personnel embarqué chargé de l'accueil et du service aux voyageurs)"
  DA: "Directeur d'Axe (responsable d'une ligne ferroviaire)"
  PV: "Procès-Verbal (document officiel de constat ou de réunion)"
  PN: "Passage à Niveau — croisement voie ferrée / route, sujet de sécurité critique"
  ETCS: "European Train Control System (système de contrôle automatique des trains)"
  KPI: "Key Performance Indicator (indicateur clé de performance)"
  LGV: "Ligne à Grande Vitesse — Infrastructure ferroviaire dédiée aux trains à grande vitesse. La LGV Tanger–Casablanca est la 1ère en Afrique. Projet LGV Kénitra–Marrakech en cours de réalisation."
  TGV: "Train à Grande Vitesse — Matériel roulant pour grandes vitesses. Technologie Alstom exploitée sur la LGV marocaine sous le nom commercial Al Boraq."
  TNR: "Train Navette Rapide — Service de trains régionaux rapides assurant des liaisons métropolitaines et inter-villes (ex. Casablanca–Rabat–Kénitra). Offre revitalisée en 2023."
  PKM: "Passager-Kilomètre — Unité de mesure du trafic voyageurs : 1 passager transporté sur 1 km = 1 PKM. Indicateur clé de performance de l'activité voyageurs."
  RFN: "Réseau Ferré National — Ensemble des lignes et infrastructures ferroviaires exploitées par l'ONCF sur le territoire marocain (environ 2 110 km de voies)."
  RGVM: "Rames à Grande Vitesse Marocaines — Nouvelles rames acquises pour la LGV. Autorisation de mise en exploitation commerciale accordée entre Casa Voyageurs et Marrakech en 2023. Essais validés sur la ligne classique."
  Al_Boraq: "Train à Grande Vitesse marocain — Train à grande vitesse reliant Casablanca à Tanger (environ 2h10). 1er TGV d'Afrique, inauguré en 2018. En 2023, il fête sa 5ème année avec une croissance remarquable du trafic."
  Al_Atlas: "Train intercités express — Train intercités à tarification modulaire, similaire au concept Al Boraq pour les liaisons inter-villes classiques."
  ERTMS: "European Rail Traffic Management System — Système de gestion du trafic ferroviaire et de signalisation."
  GSM_R: "Global System for Mobile communications Railways — Réseau radio numérique dédié aux communications ferroviaires."
  DBC: "Détection de Boîtes Chaudes — Système de détection thermique permettant de repérer des échauffements anormaux sur les essieux."

fret_et_logistique:
  EVP: "Équivalent Vingt Pieds — Unité standard de mesure des conteneurs maritimes (1 EVP = conteneur 20 pieds). En 2023, Tanger Med a traité 8,6 millions d'EVP."
  KT: "Kilotonne — Unité de mesure des volumes de fret (1 KT = 1 000 tonnes)."
  TKM: "Tonne-Kilomètre — Unité de mesure du trafic fret : 1 tonne transportée sur 1 km = 1 TKM."
  TSP: "Triple Superphosphate — Type d'engrais chimique produit et exporté par l'OCP, transporté par train depuis les usines de Safi."
  BTP: "Bâtiment et Travaux Publics — Segment fret regroupant le ciment, les matériaux de construction et les aciers."
  MITA: "Moroccan Intermodal Terminal Ain Sebaa — Port sec ONCF à Casablanca relié au port de Tanger Med. Traite les trafics de conteneurs EVP, véhicules et marchandises diverses. CA 2023 : 42 M DH."
  HTT: "Hub Terminal Tanger Med (Dépôt Hydrocarbures) — Point de départ du trafic fuel OCP depuis le terminal pétrolier de Tanger Med vers les centres de Khouribga. Volume 2023 : 146 KT (+96%)."
  SEJ: "Station d'Expédition de Jorf Lasfar — Pôle logistique de départ des trafics OCP (phosphates, engrais) et ONEE (charbon). Volume 2023 : 312 KT."
  OCP: "Office Chérifien des Phosphates — Principal client fret de l'ONCF."
  ONEE: "Office National de l'Électricité et de l'Eau Potable — Client fret majeur pour le transport de charbon et de fuel."

finance:
  EBITDA: "Earnings Before Interest, Taxes, Depreciation & Amortization — Excédent brut d'exploitation (EBE). En 2023, l'ONCF a dégagé un EBITDA de 1,6 milliard de DH."
  CAF: "Capacité d'Autofinancement — CAF 2023 : 255 802 060,46 DH."
  MDH: "Millions de Dirhams — Unité monétaire utilisée pour les agrégats financiers."
  DH: "Dirham — Monnaie nationale marocaine (MAD)."
  CAPEX: "Capital Expenditures — Dépenses d'investissement en infrastructures, matériel roulant et systèmes."
  OPEX: "Operating Expenditures — Dépenses opérationnelles courantes."

organisation:
  ONCF: "Office National des Chemins de Fer — Établissement public marocain, opérateur ferroviaire national."
  EPIC: "Établissement Public à Caractère Industriel et Commercial — Statut juridique de l'ONCF."
  UIC: "Union Internationale des Chemins de Fer — L'ONCF préside l'UIC–région Afrique."
  PPLGV: "Pôle Projets LGV — Direction interne en charge des projets LGV (ex. Kénitra–Marrakech)."
  RSE: "Responsabilité Sociétale des Entreprises — Stratégie ESG de l'ONCF."
  IDMAJE: "Intégration, Durabilité, Management, Action, Juste-à-temps, Excellence — Programme d'excellence opérationnelle (SMI)."

securite_qualite:
  SEF: "Sécurité d'Exploitation Ferroviaire — Pilier réglementaire des circulations ferroviaires."
  SST: "Santé et Sécurité au Travail — Politique de prévention des risques professionnels."
  SMI: "Système de Management Intégré — Dispositif IDMAJE regroupant qualité, SEF, SST et environnement."
  ISO: "International Organization for Standardization — L'ONCF est certifié sur plusieurs référentiels ISO (ISO 9001, ISO 14001, ISO 45001)."
  MASCIR: "Moroccan Foundation for Advanced Science, Innovation and Research — Partenaire pour la vidéosurveillance des PN."
  GES: "Gaz à Effet de Serre — Émissions CO₂ et autres gaz climatiques suivis dans le bilan carbone."

filiales:
  - "SMTR CARRE: Société Marocaine de Transport Routier CARRE — Filiale transport routier du groupe ONCF."
  - "SUPRATOURS: Supratours Travel — Filiale voyageurs (transport routier et agences de voyages)."
  - "INFRAWAY: Infraway — Filiale spécialisée en ingénierie et maintenance des infrastructures ferroviaires."
  - "SBM: Société de Billetterie et de Marketing — Filiale dédiée à la commercialisation et distribution des titres de transport."
  - "IFF: Immobilier, Foncier et Filiales — Entité gérant le patrimoine foncier et participations."
  - "SIANA: Société SIANA — Filiale ayant contribué au fonds de solidarité post-séisme d'Al Haouz en 2023."

